<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supply CRM — 中文接管</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #101318;
      color: #f5f7fa;
    }

    main {
      width: min(680px, calc(100% - 32px));
      text-align: center;
      padding: 40px 24px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(24px, 6vw, 42px);
      line-height: 1.35;
    }

    #joke {
      min-height: 2.4em;
      margin: 0 0 28px;
      color: #aeb7c2;
      font-size: clamp(18px, 4vw, 24px);
    }

    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      background: #4f46e5;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      background: #6366f1;
    }
  </style>
</head>
<body>
  <main>
    <h1>穆罕默德，你的 Supply CRM 已被中文接管 😄</h1>
    <p id="joke" aria-live="polite"></p>
    <a href="https://mohamedgalal1681999-oss.github.io/Supply-CRM/">افتح الـCRM</a>
  </main>

  <script>
    setTimeout(() => {
      document.querySelector("#joke").textContent =
        "开玩笑的，系统一切正常 😂";
    }, 2000);
  </script>
</body>
</html>
